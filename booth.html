<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booth | Snapbooth</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Kaushan+Script&family=Pacifico&family=Poppins:wght@400;500;600&display=swap rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="curtain-page">

  <header class="nav">
    <a href="index.html" class="logo">📸 snapbooth</a>
    <button id="menuBtn" class="menu-btn" aria-label="Toggle menu">☰</button>
    <nav id="navLinks" class="nav-links">
      <a href="index.html">Home</a>
      <a href="booth.html">Booth</a>
      <a href="how.html">How it Works</a>
    </nav>
  </header>

  <section id="booth" class="section">
    <h2>capture your sweet memories</h2>

    <div class="cabin">
      <div class="cabin-sign">
        <span class="bulbs"></span>
        <h3>PHOTOBOOTH</h3>
        <span class="bulbs"></span>
      </div>

      <div class="cabin-body">
        <div class="screen">
          <div class="booth" id="boothView">
            <video id="video" autoplay playsinline muted></video>
            <div id="fx"></div>
            <div id="countdown"></div>
            <div id="flash"></div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="dots" id="dots">
          <span></span><span></span><span></span><span></span>
        </div>
        <p id="status">Ready when you are</p>

        <div id="options">
          <p class="label">Theme</p>
          <div class="chips" id="themes">
            <button class="chip active" data-theme="classic">Classic</button>
            <button class="chip" data-theme="ticket">Movie Ticket</button>
            <button class="chip" data-theme="polka">Polka Cute</button>
            <button class="chip" data-theme="green">Green Gingham</button>
            <button class="chip" data-theme="special">Special Day</button>
            <button class="chip" data-theme="spidey">Spidey</button>
          </div>

          <p class="label">Filter</p>
          <div class="chips" id="filters">
            <button class="chip active" data-filter="none" data-fx="">Normal</button>
            <button class="chip" data-filter="grayscale(1) contrast(1.15) brightness(1.08)" data-fx="">B&amp;W</button>
            <button class="chip" data-filter="sepia(0.35) saturate(0.85) contrast(0.95) brightness(1.08) hue-rotate(-8deg)" data-fx="vintage">Vintage</button>
            <button class="chip" data-filter="brightness(1.12) contrast(1.15) saturate(1.3) hue-rotate(8deg)" data-fx="retro">Retro 2000s</button>
          </div>

          <div id="colorBox">
            <p class="label">Strip color</p>
            <div class="swatches" id="swatches">
              <button class="swatch active" data-bg="#ffffff" data-ink="#ff5c8a" style="background:#ffffff" aria-label="White"></button>
              <button class="swatch" data-bg="#ffc2d9" data-ink="#7a2347" style="background:#ffc2d9" aria-label="Pink"></button>
              <button class="swatch" data-bg="#d9ccff" data-ink="#3f2b82" style="background:#d9ccff" aria-label="Lavender"></button>
              <button class="swatch" data-bg="#bfe9d8" data-ink="#1f5c45" style="background:#bfe9d8" aria-label="Mint"></button>
              <button class="swatch" data-bg="#2b2233" data-ink="#ffffff" style="background:#2b2233" aria-label="Dark"></button>
            </div>
          </div>
        </div>

        <button id="startBtn" class="btn big">Start</button>
      </div>

      <button id="slotBtn" class="slot" disabled>
  <span id="slotText">your photos come out here</span>
</button>
    </div>

    <div id="resultBox" class="result hidden">
  <div class="mouth"></div>
  <div id="printOut" class="print-out">
    <canvas id="strip"></canvas>
  </div>
  <div id="resultBtns" class="row hidden">
    <button id="downloadBtn" class="btn">Download</button>
    <button id="retakeBtn" class="btn ghost">Retake</button>
  </div>
</div>
  </section>

  <script src="script.js"></script>
</body>
</html>
